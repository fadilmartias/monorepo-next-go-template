services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dilz_backend
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file: .env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
    restart: unless-stopped
    volumes:
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"