basePath: /
definitions:
  controllers_v1.ValidateRecaptchaInput:
    properties:
      action:
        type: string
      token:
        type: string
    type: object
  models.Article:
    properties:
      author:
        type: string
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      img:
        type: string
      is_active:
        type: boolean
      likes:
        type: integer
      meta_description:
        type: string
      meta_img:
        type: string
      meta_keywords:
        type: string
      published_at:
        type: string
      slug:
        type: string
      tenant_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      views:
        type: integer
    type: object
  models.Banner:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      img:
        type: string
      is_active:
        type: boolean
      link:
        type: string
      order:
        type: integer
      tenant_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      valid_from:
        type: string
      valid_until:
        type: string
    type: object
  models.Category:
    properties:
      children:
        items:
          $ref: '#/definitions/models.Category'
        type: array
      created_at:
        type: string
      desc:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      order:
        type: integer
      parent:
        $ref: '#/definitions/models.Category'
      parent_id:
        type: string
      paymentMethods:
        items:
          $ref: '#/definitions/models.PaymentMethod'
        type: array
      slug:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  models.PaymentGateway:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      metadata:
        type: string
      name:
        type: string
      order:
        type: integer
      paymentMethods:
        items:
          $ref: '#/definitions/models.PaymentMethod'
        type: array
      updated_at:
        type: string
    type: object
  models.PaymentMethod:
    properties:
      additional_fields:
        description: could be JSON
        type: string
      category:
        $ref: '#/definitions/models.Category'
      category_id:
        type: string
      code:
        type: string
      created_at:
        type: string
      desc:
        type: string
      expiry_seconds:
        type: integer
      fee_fixed:
        type: number
      fee_percent:
        type: number
      id:
        type: string
      img:
        type: string
      invoice_code:
        type: string
      is_active:
        type: boolean
      is_international:
        type: boolean
      is_ready_production:
        type: boolean
      max_amount:
        type: number
      min_amount:
        type: number
      name:
        type: string
      order:
        type: integer
      payment_gateway_id:
        type: string
      paymentGateway:
        $ref: '#/definitions/models.PaymentGateway'
      ppn:
        type: number
      type:
        type: string
      updated_at:
        type: string
    type: object
  requests.ForgotPasswordInput:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  requests.Login2FARequest:
    properties:
      code:
        maxLength: 255
        type: string
      temp_token:
        maxLength: 255
        type: string
    required:
    - code
    - temp_token
    type: object
  requests.LoginInput:
    properties:
      credential:
        maxLength: 255
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
    required:
    - credential
    - password
    type: object
  requests.RegisterInput:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
      password_confirmation:
        type: string
      phone:
        maxLength: 255
        type: string
      referral_code:
        type: string
    required:
    - email
    - name
    - password
    - password_confirmation
    - phone
    type: object
  requests.ResetPasswordInput:
    properties:
      password:
        maxLength: 255
        minLength: 8
        type: string
      password_confirmation:
        type: string
      token:
        maxLength: 255
        type: string
    required:
    - password
    - password_confirmation
    - token
    type: object
  requests.SendOTPRequest:
    properties:
      subject:
        maxLength: 255
        type: string
      target:
        maxLength: 255
        type: string
      target_type:
        enum:
        - wa
        - email
        type: string
    required:
    - subject
    - target_type
    type: object
  requests.UpdatePasswordInput:
    properties:
      current_password:
        maxLength: 255
        minLength: 8
        type: string
      new_password:
        maxLength: 255
        minLength: 8
        type: string
      new_password_confirmation:
        type: string
    required:
    - current_password
    - new_password
    - new_password_confirmation
    type: object
  requests.UpdateProfileInput:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  requests.Verify2FARequest:
    properties:
      code:
        maxLength: 255
        type: string
    required:
    - code
    type: object
  requests.VerifyEmailInput:
    properties:
      token:
        maxLength: 255
        type: string
    required:
    - token
    type: object
  requests.VerifyOTPRequest:
    properties:
      otp:
        maxLength: 6
        minLength: 6
        type: string
      subject:
        maxLength: 255
        type: string
      target:
        maxLength: 255
        type: string
      target_type:
        enum:
        - wa
        - email
        type: string
    required:
    - otp
    - subject
    - target_type
    type: object
  responses.Pagination:
    properties:
      from:
        type: integer
      has_more:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      to:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  utils.OrderedErrorResponse:
    properties:
      details: {}
      dev_message:
        type: string
      error_code:
        type: string
      errors: {}
      message:
        type: string
      success:
        type: boolean
      trace:
        type: string
    type: object
  utils.OrderedSuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      pagination:
        $ref: '#/definitions/responses.Pagination'
      success:
        type: boolean
    type: object
host: localhost:9001
info:
  contact: {}
  description: Ini adalah dokumentasi API untuk backend berbasis Go Fiber.
  title: DilZ Backend API
  version: "1.0"
paths:
  /v0/{model}:
    get:
      consumes:
      - application/json
      description: Mengambil daftar data berdasarkan nama model secara dinamis dengan
        dukungan paginasi dan filter query params.
      parameters:
      - description: 'Nama Model (contoh: users, posts)'
        in: path
        name: model
        required: true
        type: string
      - description: Gunakan cache Redis (true/false)
        in: query
        name: cache
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "404":
          description: Model tidak ditemukan di registry
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Ambil daftar data model
      tags:
      - Generic API
    post:
      consumes:
      - application/json
      description: Menyimpan entri data baru ke database untuk model yang ditentukan.
      parameters:
      - description: Nama Model
        in: path
        name: model
        required: true
        type: string
      - description: Data JSON yang akan disimpan
        in: body
        name: payload
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Berhasil membuat data
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "404":
          description: Model tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Buat data baru
      tags:
      - Generic API
  /v0/{model}/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus (atau soft delete) data berdasarkan ID.
      parameters:
      - description: Nama Model
        in: path
        name: model
        required: true
        type: string
      - description: ID data
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil menghapus data
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "404":
          description: Data atau model tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Hapus data
      tags:
      - Generic API
    get:
      consumes:
      - application/json
      description: Mengambil satu baris data berdasarkan ID atau slug secara dinamis.
      parameters:
      - description: Nama Model
        in: path
        name: model
        required: true
        type: string
      - description: ID atau Slug data
        in: path
        name: id
        required: true
        type: string
      - description: Set true jika mencari berdasarkan slug
        in: query
        name: slug
        type: boolean
      - description: Gunakan cache Redis (true/false)
        in: query
        name: cache
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail data
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "404":
          description: Model tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Ambil detail data model
      tags:
      - Generic API
    patch:
      consumes:
      - application/json
      description: Melakukan update data secara parsial berdasarkan field yang dikirimkan.
      parameters:
      - description: Nama Model
        in: path
        name: model
        required: true
        type: string
      - description: ID data
        in: path
        name: id
        required: true
        type: string
      - description: Data JSON parsial untuk update
        in: body
        name: payload
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengupdate data parsial
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "404":
          description: Data tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Update parsial data
      tags:
      - Generic API
    put:
      consumes:
      - application/json
      description: Melakukan update data yang ada berdasarkan ID. Menggunakan PUT
        biasanya merepresentasikan penggantian keseluruhan baris.
      parameters:
      - description: Nama Model
        in: path
        name: model
        required: true
        type: string
      - description: ID data
        in: path
        name: id
        required: true
        type: string
      - description: Data JSON untuk update
        in: body
        name: payload
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengupdate data
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "404":
          description: Data tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Update keseluruhan data
      tags:
      - Generic API
  /v0/uploads:
    post:
      consumes:
      - multipart/form-data
      description: 'Endpoint untuk mengunggah file. Mendukung penerimaan file melalui
        field form-data: ''image'', ''file'', atau ''tinymce''. Hanya mendukung ekstensi
        jpg, png, webp, gif, dan svg.'
      parameters:
      - description: File gambar yang akan diupload
        in: formData
        name: image
        type: file
      - description: File dokumen/umum yang akan diupload
        in: formData
        name: file
        type: file
      - description: File gambar khusus dari editor TinyMCE
        in: formData
        name: tinymce
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengunggah file
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Gagal memproses form, field tidak ditemukan, atau tipe file
            tidak didukung
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Kesalahan konfigurasi server atau gagal menyimpan file
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Upload file (Gambar, Dokumen, atau TinyMCE)
      tags:
      - Upload
  /v1/activity-logs/{id}:
    get:
      consumes:
      - application/json
      description: Mengambil satu baris data riwayat aktivitas (Activity Log) berdasarkan
        ID.
      parameters:
      - description: ID dari Activity Log
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan data activity log
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "404":
          description: Activity Log tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Terjadi kesalahan pada server
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Ambil detail Activity Log
      tags:
      - Activity Log
  /v1/articles:
    get:
      consumes:
      - application/json
      description: Mengambil daftar artikel yang sudah dipublikasikan (published)
        untuk blog CodeXtory. Mendukung limitasi jumlah data menggunakan query parameter.
      parameters:
      - default: 10
        description: Batasan jumlah artikel yang dikembalikan
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan data article
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "500":
          description: Gagal mendapatkan data article
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Ambil daftar artikel publik
      tags:
      - Articles
  /v1/articles/{slug}:
    get:
      consumes:
      - application/json
      description: Mengambil satu data artikel yang dipublikasikan berdasarkan slug-nya.
        Terdapat opsi untuk memuat artikel terkait (related articles).
      parameters:
      - description: Slug dari artikel
        in: path
        name: slug
        required: true
        type: string
      - default: false
        description: Set true untuk menyertakan artikel terkait
        in: query
        name: related
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan data article
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "404":
          description: Artikel tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Ambil detail artikel
      tags:
      - Articles
  /v1/articles/popular:
    get:
      consumes:
      - application/json
      description: Mengambil daftar artikel yang paling banyak dibaca atau berstatus
        populer. Bisa mengecualikan artikel tertentu menggunakan parameter 'except'.
      parameters:
      - default: 10
        description: Batasan jumlah artikel yang dikembalikan
        in: query
        name: limit
        type: integer
      - description: ID atau slug artikel yang ingin dikecualikan dari hasil
        in: query
        name: except
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan data article
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "404":
          description: Artikel tidak ditemukan
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Ambil artikel populer
      tags:
      - Articles
  /v1/articles/process:
    post:
      consumes:
      - application/json
      description: Memproses data payload artikel. Jika field ID pada payload kosong,
        maka akan melakukan Insert (Tambah Artikel). Jika field ID terisi, akan melakukan
        Update pada artikel tersebut.
      parameters:
      - description: Data JSON Artikel
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.Article'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil menambahkan atau mengupdate artikel
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Gagal memproses data artikel dari body request
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Gagal memproses/menyimpan artikel ke database
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Tambah atau Update Artikel
      tags:
      - Articles
  /v1/auth/disable-2fa:
    post:
      consumes:
      - application/json
      description: Mematikan fitur Two-Factor Authentication untuk akun pengguna yang
        sedang login.
      produces:
      - application/json
      responses:
        "200":
          description: Sukses menghapus 2FA
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "500":
          description: Gagal menghapus 2FA
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      security:
      - BearerAuth: []
      summary: Nonaktifkan 2FA
      tags:
      - Two-Factor Auth
  /v1/auth/discord/callback:
    get:
      description: Menangani respons balikan dari Discord.
      parameters:
      - description: Kode otorisasi dari Discord
        in: query
        name: code
        required: true
        type: string
      responses: {}
      summary: Callback Discord OAuth
      tags:
      - OAuth
  /v1/auth/discord/redirect:
    get:
      description: Mengarahkan pengguna ke halaman otorisasi OAuth Discord.
      responses: {}
      summary: Login Discord (Redirect)
      tags:
      - OAuth
  /v1/auth/facebook/callback:
    get:
      description: Menangani respons balikan dari Facebook.
      parameters:
      - description: Kode otorisasi dari Facebook
        in: query
        name: code
        required: true
        type: string
      responses: {}
      summary: Callback Facebook OAuth
      tags:
      - OAuth
  /v1/auth/facebook/redirect:
    get:
      description: Mengarahkan pengguna ke halaman otorisasi OAuth Facebook.
      responses: {}
      summary: Login Facebook (Redirect)
      tags:
      - OAuth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Meminta link token reset password dikirimkan ke email yang terdaftar.
      parameters:
      - description: Email pengguna
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/requests.ForgotPasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: Token reset password berhasil dikirim
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Validasi request gagal
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Gagal memproses forgot password
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Lupa Password
      tags:
      - Authentication
  /v1/auth/google/callback:
    get:
      description: Menangani respons balikan (code) dari Google setelah login sukses.
      parameters:
      - description: Kode otorisasi dari Google
        in: query
        name: code
        required: true
        type: string
      responses: {}
      summary: Callback Google OAuth
      tags:
      - OAuth
  /v1/auth/google/one-tap:
    post:
      consumes:
      - application/json
      description: Memvalidasi kredensial Google One Tap JWT yang dikirim dari klien.
      parameters:
      - description: Format JSON dengan property 'credential'
        in: body
        name: payload
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil login atau membutuhkan 2FA
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "500":
          description: Error handle user google
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Google One Tap Login
      tags:
      - OAuth
  /v1/auth/google/redirect:
    get:
      description: Mengarahkan (redirect) pengguna ke halaman otorisasi OAuth Google.
      responses: {}
      summary: Login Google (Redirect)
      tags:
      - OAuth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Memproses kredensial (email/username) dan password. Akan mengatur
        cookie `access_token` dan `refresh_token` jika berhasil. Mengembalikan flag
        khusus jika akun mengaktifkan 2FA.
      parameters:
      - description: Kredensial login
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/requests.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil atau membutuhkan 2FA
          schema:
            $ref: '#/definitions/utils.OrderedSuccessResponse'
        "400":
          description: Validasi request gagal
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
        "401":
          description: Email atau password salah
          schema:
            $ref: '#/definitions/utils.OrderedErrorResponse'
      summary: Login User
      tags:
      - Authentication
  /v1/auth/login-2fa:
    post:
      consumes:
      - application/json
      description: Menyelesaikan proses login dengan menggunakan `temp_token` dari
        tahap login pertama dan kode otentikator.
      parameters:
      - description: Temp token dan kode 2FA
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/requests.Login2FARequest'
      produces:
      - application/json
